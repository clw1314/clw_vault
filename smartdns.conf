# 服务器名称
server-name smartdns-vps

# 仅本地监听
bind 127.0.0.1:53
bind [::1]:53

# 缓存
cache-size 10000
cache-persist yes
cache-file /var/cache/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400

# 日志
log-level warn
log-file /var/log/smartdns/smartdns.log
log-size 128k
log-num 2

# TTL
rr-ttl-min 60
rr-ttl-max 86400

# 响应模式
response-mode fastest-ip
speed-check-mode tcp:443,tcp:80

# 双栈优化
dualstack-ip-selection yes

# ============ Bootstrap DNS（仅用于启动时解析 DoT 服务器域名）============
server 1.1.1.1 -bootstrap-dns -exclude-default-group
server 8.8.8.8 -bootstrap-dns -exclude-default-group
server 9.9.9.9 -bootstrap-dns -exclude-default-group


# ============ 全部使用 DoT（DNS over TLS，端口 853）============
# Cloudflare DoT
server-tls 1.1.1.1:853 -group default -tls-host-verify cloudflare-dns.com
server-tls 1.0.0.1:853 -group default -tls-host-verify cloudflare-dns.com
# Google DoT
server-tls 8.8.8.8:853 -group default -tls-host-verify dns.google
server-tls 8.8.4.4:853 -group default -tls-host-verify dns.google
# Quad9 DoT
server-tls 9.9.9.9:853 -group default -tls-host-verify dns.quad9.net
server-tls 149.112.112.112:853 -group default -tls-host-verify dns.quad9.net
